services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-link}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-link}
      POSTGRES_DB: ${POSTGRES_DB:-link}
    # Localhost-only so `npm test` / CLI tools can reach the DB.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-link} -d ${POSTGRES_DB:-link}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Development server with hot reload — start with:
  #   docker compose --profile dev up -d dev
  dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-link}:${POSTGRES_PASSWORD:-link}@postgres:5432/${POSTGRES_DB:-link}
      BETTER_AUTH_URL: http://localhost:${APP_PORT:-3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-secret-do-not-use-in-prod}
      NODE_ENV: development
    volumes:
      - .:/app
      # Keep dependencies and build cache container-owned so host artifacts
      # never shadow what npm ci installed inside the image.
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    build:
      context: .
      target: migrate
    environment: &app-env
      DATABASE_URL: postgres://${POSTGRES_USER:-link}:${POSTGRES_PASSWORD:-link}@postgres:5432/${POSTGRES_DB:-link}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:${APP_PORT:-3000}}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    ports:
      - "${APP_PORT:-3000}:3000"
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
